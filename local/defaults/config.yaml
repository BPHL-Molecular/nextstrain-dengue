# Configuration for the local (private) sequence preparation workflow.
#
# This workflow turns consensus genomes from the Daytona_dengue pipeline plus a
# hand-filled metadata TSV into per-serotype files that the phylogenetic
# workflow merges with the public GenBank data produced by ingest/.

# Raw inputs. Override on the command line with, for example:
#   nextstrain build local --config local_sequences=/path/to/consensus.fasta
local_sequences: "input/sequences.fasta"
local_metadata: "input/metadata.tsv"

# Values stamped onto every local record. These strings must match the values
# ingest produces, or colorings and traits will fragment into duplicate
# categories:
#   country / region -> phylogenetic/defaults/color_orderings.tsv
#   host_genus / host_type -> ingest/defaults/host_hostgenus_hosttype_map.tsv
constants:
  country: "USA"
  region: "North America"
  division: "Florida"
  # Default host. Override per sample with a host column; the converter does
  # this for mosquito pools. host_genus and host_type are not set here: they are
  # looked up from host via validate.host_map so they always match ingest.
  host: "Homo sapiens"
  is_lab_host: "false"
  institution: "Florida Department of Health, Bureau of Public Health Laboratories"
  authors: "FL BPHL"
  full_authors: "Florida Department of Health, Bureau of Public Health Laboratories"
  url: ""
  # Paired with curate.data_source in ingest/defaults/config.yaml. These two
  # values become the Auspice "Data source" coloring.
  data_source: "Florida BPHL"

# Auspice display name. Available fields: serotype_number, country, accession, year.
strain_template: "DENV{serotype_number}/{country}/{accession}/{year}"

validate:
  # Sample identifiers must be unique, stable across runs, and free of the
  # characters that break Newick trees and Auspice node names. Anything the lab
  # already uses is fine, e.g. TVU26000019 or MosquitoPool_K26-10948.
  id_regex: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
  # Local identifiers are checked against the public accessions in this file when
  # it exists. On a duplicate ID augur merge silently keeps one sequence and
  # discards the other, so a collision has to be caught here.
  public_metadata: "../ingest/results/metadata_all.tsv"
  # The same host to host_genus/host_type map ingest uses, so a mosquito pool is
  # labelled Aedes/Mosquito with the exact spellings the public rows carry.
  host_map: "../ingest/defaults/host_hostgenus_hosttype_map.tsv"
  # Country to region lookup for travel_country, read from the Auspice colour
  # ordering file so exposure regions use the same names as everything else.
  region_map: "../phylogenetic/defaults/color_orderings.tsv"
  required_columns: ["sample_id", "serotype", "collection_date", "nextclade_clade"]
  optional_columns: ["strain", "country", "region", "division", "location", "host",
                     "case_origin", "travel_country", "authors", "institution", "notes",
                     "vadr_flag"]
  allowed_serotypes: ["denv1", "denv2", "denv3", "denv4"]
  # Below this many unambiguous bases a sample cannot pass `augur filter
  # --min-length 5000` on its own merit and only reaches the genome tree because
  # include.txt forces it in.
  min_ungapped_length: 5000
  max_ambiguous_fraction: 0.30
  # true turns every warning into a hard error.
  strict: false

# GenBank data searched for copies of local genomes, per serotype. Written by
# ingest/, so run it before this workflow.
genbank_copies:
  metadata: "../ingest/results/metadata_{serotype}.tsv"
  sequences: "../ingest/results/sequences_{serotype}.fasta"
  reference: "../phylogenetic/defaults/{serotype}/reference.gb"

# Output column order. Any column missing after the merge is created empty.
# A superset of curate.metadata_columns in ingest/defaults/config.yaml.
metadata_columns:
  - strain
  - accession
  - accession_version
  - date
  - region
  - country
  - division
  - location
  - length
  - host
  - host_genus
  - host_type
  - is_lab_host
  - date_released
  - date_updated
  - authors
  - full_authors
  - institution
  - serotype_genbank
  - url
  - data_source
  - country_exposure
  - region_exposure
  - genotype_nextclade
  - genotype
  - major_lineage
  - minor_lineage
  - case_origin
  - travel_country
  - notes
  - vadr_flag
