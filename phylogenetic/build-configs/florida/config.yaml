# Florida build: locally ingested GenBank data plus BPHL sequences.
#
# Run from the repo root, after both ingest/ and local/ have finished:
#   nextstrain build phylogenetic --configfile build-configs/florida/config.yaml --cores 32
#
# Snakemake merges this file over defaults/config_dengue.yaml recursively, so
# only the differences are listed. The full filter block is restated because
# relying on a partial merge of a nested key is a silent-failure risk.

serotypes: ['all', 'denv1', 'denv2', 'denv3', 'denv4']
genes: ['genome', 'E']

# Repointed from data.nextstrain.org to this machine's own ingest output, so the
# public half of the build is pinned alongside the private half. These are plain
# relative paths, so path_or_url() returns them unchanged and no storage plugin
# or credential is involved.
inputs:
  - name: ncbi
    metadata: "../ingest/results/metadata_{serotype}.tsv"
    sequences: "../ingest/results/sequences_{serotype}.fasta"

additional_inputs:
  - name: florida
    metadata: "../local/results/metadata_{serotype}.tsv"
    sequences: "../local/results/sequences_{serotype}.fasta"

filter:
  exclude: "defaults/exclude.txt"
  # augur filter --include takes multiple files. The second one holds every local
  # sample ID, which is what stops subsample_max_sequences from discarding them.
  include:
    - "defaults/{serotype}/include.txt"
    - "../local/results/include_{serotype}.txt"
  group_by: "year region"
  min_length:
    genome: 5000
    E: 1000
  subsample_max_sequences: '4000'

# Both the collection and the exposure geography are reconstructed.
#
# The exposure columns say where infection likely happened rather than where the
# sample was reported. Public rows copy country and region into them; local rows
# set them from travel_country when a case was imported. Reconstructing on those
# is what stops an imported case making Florida look like a source rather than a
# sink.
#
# The collection columns are reconstructed as well so the Auspice map can be
# switched between the two. Transmission lines are drawn by comparing a node
# against its parent, and internal nodes only carry what augur traits produces,
# so anything offered as a geo_resolution in export.smk has to appear here or the
# map silently draws no lines.
#
# The all build stays on region alone, matching upstream, because country level
# reconstruction across four serotypes is slow and not very meaningful.
traits:
  sampling_bias_correction: '3'
  traits_columns:
    all: 'region region_exposure serotype_genbank'
    denv1: 'country region country_exposure region_exposure serotype_genbank'
    denv2: 'country region country_exposure region_exposure serotype_genbank'
    denv3: 'country region country_exposure region_exposure serotype_genbank'
    denv4: 'country region country_exposure region_exposure serotype_genbank'

export:
  description: "defaults/description.md"
  title: "Dengue virus in Florida"
  maintainers:
    - name: "Florida Bureau of Public Health Laboratories"
  build_url: "https://github.com/BPHL-Molecular/nextstrain-dengue"
